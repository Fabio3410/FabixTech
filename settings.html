<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einstellungen | Fabio3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="input-group">
        <label>Neues Profilbild hochladen</label>
        <input type="file" id="avatarInput" accept="image/png, image/jpeg">
        <button type="button" onclick="deleteAvatar()" class="btn-danger">Bild löschen</button>
        <button type="button" onclick="uploadAvatar()" class="btn-action">Bild speichern</button>
        <button type="button" onclick="toggleDarkMode()" class="theme-btn">Dark mode</button>
    </div>

    <script>    
    function toggleDarkMode() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = (currentTheme === 'dark') ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    }

    async function deleteAvatar() {
        const userStr = localStorage.getItem('user');
        if (!userStr) {
            alert('Bitte melde dich zuerst an.');
            return;
        }

        const user = JSON.parse(userStr);
    
        if (!user.profile_picture) {
            alert('Du hast aktuell kein eigenes Profilbild.');
            return;
        }

        if (!confirm('Möchtest du dein Profilbild wirklich löschen? Es wird wieder das farbige 3D-Logo angezeigt.')) {
            return;
        }

        const response = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'delete_avatar',
                email: user.email
            })
        });

        const result = await response.json();

        if (result.status === 'success') {
            user.profile_picture = null;
            localStorage.setItem('user', JSON.stringify(user));
            alert('Profilbild erfolgreich gelöscht.');
            window.location.href = '/';
        } else {
            alert('Fehler beim Löschen: ' + (result.message || 'Unbekannter Fehler'));
        }
    }

    async function uploadAvatar() {
        const fileInput = document.getElementById('avatarInput');
        const userStr = localStorage.getItem('user');

        if (!userStr) {
            alert('Bitte melde dich zuerst an.');
            return;
        }

        const user = JSON.parse(userStr);
        if (!fileInput.files[0]) {
            alert('Bitte wähle ein Bild aus.');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function (e) {
            const img = new Image();
            img.src = e.target.result;

            img.onload = async function () {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 150;
                canvas.height = 150;
                ctx.drawImage(img, 0, 0, 150, 150);

                const base64Image = canvas.toDataURL('image/jpeg', 0.8);
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'update_avatar',
                        email: user.email,
                        profile_picture: base64Image
                    })
                });
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const errorHTML = await response.text();
                    console.error('Serverantwort (kein JSON):', errorHTML);
                    alert('Serverfehler beim Speichern. Bitte D1-Datenbank prüfen.');
                    return;
                }
                
                const result = await response.json();

                if (result.status === 'success') {
                    user.profile_picture = base64Image;
                    localStorage.setItem('user', JSON.stringify(user));
                    alert('Profilbild geändert!');
                    window.location.href = '/';
                } else {
                    alert('Fehler beim Hochladen.');
                }
            };
        };
    reader.readAsDataURL(file);
    }
    </script>
</body>
</html>
