<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="Fabio3D">
    <title>Checkout | Fabio3D</title>
    <script src="https://js.stripe.com/v3/"></script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96"/>
    <link rel="manifest" href="favicon/site.webmanifest"/>
    <script src="/theme-toggle.js" defer></script>
    <script src="/alert.js"></script>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-inner-box: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
        }

        html[data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-inner-box: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: black;
        }

        html[data-theme="dark"] .form-control {
            background-color: #30313d;
            border: 1px solid #424353;
            color: #ffffff;
        }

        html[data-theme="dark"] .form-control::placeholder {
            color: #797f8c;
            opacity: 1;
        }

        html[data-theme="dark"] .form-control:focus {
            border-color: #d40202;
            box-shadow: 0 0 0 1px #d40202, 0 0 8px rgba(212, 2, 2, 0.35);
            outline: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .checkout-container {
            max-width: 520px;
            margin: 40px auto;
            padding: 32px;
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .checkout-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .stripe-inner-card {
            background: var(--bg-inner-box);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }

        .section-heading {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control::placeholder {
            color: #94a3b8;
            opacity: 1;
        }

        .form-control:focus {
            border-color: #d40202;
            box-shadow: 0 0 0 1px #d40202, 0 0 6px rgba(212, 2, 2, 0.2);
        }

        html[data-theme="dark"] .form-control {
            background-color: #30313d;
            border: 1px solid #424353;
            color: #ffffff;
        }

        html[data-theme="dark"] .form-control::placeholder {
            color: #797f8c;
        }

        html[data-theme="dark"] .form-control:focus {
            border-color: #d40202;
            box-shadow: 0 0 0 1px #d40202, 0 0 8px rgba(212, 2, 2, 0.35);
        }

        .pay-btn {
            width: 100%;
            background-color: #d40202;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .pay-btn:hover {
            background-color: #b00202;
        }

        .pay-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .footer-links {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h2 class="checkout-title">Bestellung abschließen</h2>

        <form id="payment-form">
            <div class="stripe-inner-card" id="order-summary" style="margin-bottom: 20px;">
                <h3 class="section-heading" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Deine Bestellung</span>
                </h3>
                <div id="checkout-item-list" style="margin-bottom: 15px; font-size: 14px; color: var(--text-muted);"></div>
                <div style="display: flex; gap: 8px; margin-bottom: 6px;">
                    <input type="text" id="promo-code-input" class="form-control" placeholder="Aktionscode eingeben" style="flex: 1; text-transform: uppercase;">
                    <button type="button" id="apply-promo-btn" onclick="applyPromoCode()" style="background: #d40202; color: #ffffff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600;">Einlösen</button>
                </div>
                <div id="promo-message" style="font-size: 12px; margin-bottom: 12px; font-weight: 500;"></div>
                <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; color: var(--text-main); border-top: 1px solid var(--border-color); padding-top: 12px;">
                    <span>Gesamtbetrag</span>
                    <span id="checkout-total-price">Lade...</span>
                </div>
            </div>
            <div class="stripe-inner-card">
                <h3 class="section-heading">Versanddaten</h3>
                <div class="form-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" class="form-control" placeholder="email@beispiel.ch" required>
                </div>
                <div class="form-group">
                    <label for="name">Vollständiger Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Dein Name" required>
                </div>
                <div class="form-group">
                    <label for="street">Strasse & Hausnummer</label>
                    <input type="text" id="street" class="form-control" placeholder="Musterstrasse 12" required minlength="4">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="zip">PLZ</label>
                        <input type="text" id="zip" class="form-control" placeholder="3000" 
                            required pattern="[1-9][0-9]{3}" maxlength="4" 
                            title="Bitte eine gültige 4-stellige Schweizer PLZ eingeben">
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label for="city">Ort</label>
                        <input type="text" id="city" class="form-control" placeholder="Bern" required minlength="2">
                    </div>
                </div>
                <h3 class="section-heading" style="margin-top: 20px;">Zahlungsmethode</h3>
                <div id="payment-element"></div>
                <button type="submit" id="submit-btn" class="pay-btn">Zahlen</button>
                <div class="footer-links">
                    Powered by <strong>Stripe</strong>
                </div>
            </div>
        </form>
    </div>
    <script src="/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initCheckoutPage();
        });
    </script>
</body>
</html>
