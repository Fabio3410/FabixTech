<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Fabio3D</title>
    <script src="https://js.stripe.com/v3/"></script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

    function toggleDarkMode() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
    
        document.documentElement.setAttribute('data-theme', newTheme);
        if (document.body) {
            document.body.setAttribute('data-theme', newTheme);
        }
        localStorage.setItem('theme', newTheme);
    }
    </script>
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg"/>
    <link rel="shortcut icon" href="favicon/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png"/>
    <link rel="manifest" href="favicon/site.webmanifest"/>
    <style>
        .checkout-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h2 style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 26px; font-weight: 700; color: #1e293b; margin-top: 10px; margin-bottom: 25px; text-align: left; letter-spacing: -0.5px;">Bestellung abschließen</h2>
        <div id="checkout-container" style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; color: #000000; margin-top: 10px; margin-bottom: 25px; text-align: left; letter-spacing: -0.5px;">
            <p>Kasse wird geladen...</p>
        </div>
    </div>

    <script src="/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initCheckoutPage();
        });
    </script>
</body>
</html>
