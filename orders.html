<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Bestellungen | Fabio3D</title>
    <link rel="stylesheet" href="style.css">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <script src="https://kit.fontawesome.com/fba23d88db.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg"/>
    <link rel="shortcut icon" href="favicon/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png"/>
    <link rel="manifest" href="favicon/site.webmanifest"/>
    <link rel="prefetch" href="shop" as="document">
    <script src="script.js" defer></script>
    <script src="/alert.js"></script>
    <script src="/theme-toggle.js" defer></script>
    <style>
        .navbar {
            position: fixed !important;
            top: 0 !important;
            width: 100% !important;
            height: 85px !important;
            background-color: var(--bg-card) !important;
            border-bottom: 1.2px solid var(--border-color) !important;
            z-index: 1000 !important;
            box-shadow: var(--shadow-sm) !important;
        }

        .nav-container {
            max-width: 1440px !important;
            margin: 0 auto !important;
            padding: 0 2.4rem !important;
            height: 100% !important;
            display: flex !important;
            justify-content: flex-start !important;
            align-items: center !important;
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 0;
            color: #d40202;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: #960505;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index" class="btn-back">&larr; Zurück zur Startseite</a>
        </div>
    </nav>

    <main style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
        <h2>Meine <span class="gradient-text">Bestellungen</span></h2>
        <div id="my-orders-container" style="margin-top: 24px;">Lade deine Bestellungen...</div>
    </main>
    <footer>
        <p>&copy; <span id="copyright"><script>document.getElementById('copyright').appendChild(document.createTextNode(new Date().getFullYear()))</script></span> Fabio3D. Alle Rechte vorbehalten.</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('my-orders-container');
            const token = localStorage.getItem('session_id') || (JSON.parse(localStorage.getItem('user') || '{}')).session_id;
            if (!token) {
                container.innerHTML = '<p>Bitte <a href="login">melde dich an</a>, um deine Bestellungen zu sehen.</p>';
                return;
            }

            try {
                const res = await fetch('/api/my-orders', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error();

                const orders = await res.json();

                if (!orders || orders.length === 0) {
                    container.innerHTML = `
                        <div class="material-card" style="text-align: center; padding: 48px 24px; margin-top: 20px;">
                            <i class="fa-solid fa-box-open" style="font-size: 48px; color: var(--text-muted); margin-bottom: 16px;"></i>
                            <h3 style="font-size: 20px; margin-bottom: 8px; color: var(--text-main);">Noch keine Bestellungen</h3>
                            <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 24px;">Du hast bisher noch keine Bestellungen aufgegeben. Entdecke jetzt unsere 3D-Druck-Produkte im Shop!</p>
                            <a href="shop" class="btn btn-primary" style="text-decoration: none; display: inline-block;">Zum Shop</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.map(order => {
                    const trackingLink = order.tracking_number 
                        ? `<a href="https://service.post.ch/ekp-web/ui/list?mailpieces=${encodeURIComponent(order.tracking_number)}" target="_blank" class="btn btn-primary" style="display: inline-block; margin-top: 10px; font-size: 14px; padding: 8px 14px;">Paket verfolgen (Die Post) &#8599;</a>`
                        : '<p style="font-size: 13px; color: var(--text-muted); margin-top: 8px;">Noch keine Sendungsnummer hinterlegt.</p>';

                    return `
                        <div class="material-card" style="margin-bottom: 20px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 12px;">
                                <strong>Bestellung #${order.id}</strong>
                                <span class="badge" style="background: var(--bg-dark); padding: 4px 10px; border-radius: 12px;">${order.status || 'Offen'}</span>
                            </div>
                            <p style="font-size: 14px; margin-bottom: 8px;">Gesamtsumme: <strong>CHF ${Number(order.total_amount).toFixed(2)}</strong></p>
                            ${trackingLink}
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                container.innerHTML = '<p>Fehler beim Laden deiner Bestellungen.</p>';
            }
        });
    </script>
</body>
</html>
