<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="FabixTech">
    <title>Seite nicht gefunden</title>
    <link rel="canonical" href="https://fabixtech.ch/" />
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        if (window.location.hostname === 'fabio3d.pages.dev') {
            window.location.replace('https://fabixtech.ch' + window.location.pathname + window.location.search);
        }
    </script>
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg"/>
    <link rel="shortcut icon" href="favicon/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png"/>
    <link rel="manifest" href="favicon/site.webmanifest"/>
    <script src="/alert.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        html[data-theme="dark"] {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            color: #d40202;
        }

        h2 {
            font-size: 2rem;
            margin: 10px 0 20px 0;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: var(--text-muted);
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            color: #d40202;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: #960505;
            text-decoration: underline;
        }
        
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>Hoppla!</h2>
    <p>Die Seite, die du suchst, gibts nicht.</p>
    <a href="/" class="btn-back">&larr; Zurück zur Startseite</a>
</body>
</html>
