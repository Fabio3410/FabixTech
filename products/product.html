<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Produkt-Details - Fabio3D</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../style.css">
    <script src="../alert.js" defer></script>
    <script src="../cart.js" defer></script>
    <script src="../slider.js" defer></script>
    <script src="../color-slider.js" defer></script>
    <script src="products-data.js" defer></script>
    <script src="product-loader.js" defer></script>
    <script src="https://kit.fontawesome.com/fba23d88db.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="docs">
                <a href="../shop" style="display: inline-block;">&larr; Zurück zum Shop</a>
            </div>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i> <span id="cart-count">0</span>
            </div>
        </div>
    </nav>
    
    <div class="docs">
        <a href="../index" style="display: inline-block; margin: 20px;">&larr; Zurück zum Shop</a>
    </div>

    <div class="product-details" id="product-container">
        <p style="text-align: center; padding: 40px;">Produkt wird geladen...</p>
    </div>

    <div id="cart-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Dein Warenkorb</h3>
            <span class="close-btn" onclick="toggleCart()">&times;</span>
        </div>
        <div id="cart-items-container">
            <p class="empty-msg">Dein Warenkorb ist noch leer.</p>
        </div>
        <div class="sidebar-footer">
            <div class="cart-summary-box">
                <div class="summary-row subtotal-row">
                    <span>Zwischensumme:</span>
                    <span id="cart-subtotal">CHF 0.00</span>
                </div>
                <div class="summary-row shipping-row">
                    <span>Versand:</span>
                    <span id="cart-shipping">CHF 5.70</span>
                </div>
                <hr class="summary-divider">
                <div class="summary-row total-row">
                    <strong>Gesamtsumme:</strong>
                    <strong id="cart-total">CHF 0.00</strong>
                </div>
            </div>
            <div style="margin-top: 15px; font-size: 14px; line-height: 1.5; color: #333333;">
                <input type="checkbox" id="legal-checkbox" style="vertical-align: middle; margin-right: 6px; cursor: pointer;">
                <label for="legal-checkbox" style="vertical-align: middle; cursor: pointer;">
                    Ich habe die <a href="agb/agb" target="_blank" style="color: #2563eb; text-decoration: none; font-weight: bold;">AGB</a> und die <a href="privacy_policy/privacy_policy" target="_blank" style="color: #2563eb; text-decoration: none; font-weight: bold;">Datenschutzerklärung</a> gelesen und bin mit ihnen einverstanden.
                </label>
            </div>
            <button class="checkout-button" id="checkout-button" disabled onclick="checkout()">Zur Kasse</button>
        </div>
    </div>
    <script>
    alert("HTML wurde geladen!");
    console.log("HTML-Test funktioniert!");
    </script>
    <footer>
        <p>&copy; 2026 Fabio3D. Alle Rechte vorbehalten.</p>
    </footer>
</body>
</html>
