<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Cone Fidget</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="product-style.css">
    <script src="../alert.js" defer></script>
    <script src="../cart.js" defer></script>
    <script src="../script.js" defer></script>
    <script src="../slider.js" defer></script>
    <script src="../color-slider.js" defer></script>
    <script src="https://kit.fontawesome.com/fba23d88db.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="docs">
                <a href="/shop" style="display: inline-block;">&larr; Zurück zum Shop</a>
            </div>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i> <span id="cart-count">0</span>
            </div>
        </div>
    </nav>
    
    <div class="docs">
        <a href="../#shop" style="display: inline-block; margin: 20px;">&larr; Zurück zum Shop</a>
    </div>
    
    <div class="product-details">
        <div class="product-card-detail-view">
            <h1>Spiral Cone Fidget</h1>
            <div class="detail-left-side">
                <div class="slider-container">
                    <div class="slides">
                        <img class="product-img" 
                            src="../images/spiral_fidget_schwarz_rot_1.png" 
                            data-images="../images/spiral_fidget_schwarz_rot_1.png, ../images/spiral_fidget_schwarz_rot_2.png, ../images/spiral_fidget_schwarz_gelb_1.png, ../images/spiral_fidget_schwarz_gelb_2.png, ../images/spiral_fidget_schwarz_weiss_1.png, ../images/spiral_fidget_schwarz_weiss_2.png, ../images/spiral_fidget_rot_weiss_1.png, ../images/spiral_fidget_rot_weiss_2.png"
                            data-index="0"
                            alt="Spiral-Cone Fidget">
                    </div>
                    <button class="arrow prev" id="slides-arrow">&#10094;</button>
                    <button class="arrow next" id="slides-arrow">&#10095;</button>
                </div>
                <div class="tech-specs">
                    <span class="spec"><b>Material:</b> PLA</span>
                    <span class="spec"><b>Qualität:</b> 0.20mm</span>
                    <span class="spec"><b>Infill:</b> 20% Gyroid</span>
                </div>
            </div>
            <div class="product-info">
                <span class="prod-category">Spielzeug</span>
                <div class="long-description">
                    <p></p>
                </div>
                <h4><strong>Varianten</strong></h4>
                <div class="color-slider-container">
                    <button type="button" class="nav-arrow left" onclick="scrollSlider(this, -1)">&#10094;</button>
                    <button type="button" class="nav-arrow right" onclick="scrollSlider(this, 1)">&#10095;</button>
                    <div class="color-slider-track">
                        <button class="variant-btn active" data-variant-images="../images/spiral_fidget_schwarz_rot_1.png, ../images/spiral_fidget_schwarz_rot_2.png" data-id="spiral_cone_schwarz_rot" onclick="jumpToSlide(this, 0)">Schwarz/Rot</button>
                        <button class="variant-btn" data-variant-images="../images/spiral_fidget_schwarz_gelb_1.png, ../images/spiral_fidget_schwarz_gelb_2.png" data-id="spiral_cone_schwarz_gelb" onclick="jumpToSlide(this, 1)">Schwarz/Gelb</button>
                        <button class="variant-btn" data-variant-images="../images/spiral_fidget_schwarz_weiss_1.png, ../images/spiral_fidget_schwarz_weiss_2.png" data-id="spiral_cone_schwarz_weiss" onclick="jumpToSlide(this, 2)">Schwarz/Weiss</button>
                        <button class="variant-btn" data-variant-images="../images/spiral_fidget_rot_weiss_1.png, ../images/spiral_fidget_rot_weiss_2.png" data-id="spiral_cone_rot_weiss" onclick="jumpToSlide(this, 3)">Rot/Weiss</button>
                    </div>
                </div>
            </div>
            <div class="product-footer">
                <div class="price-block">
                    <span class="currency">CHF</span>
                    <span class="price">1,95</span>
                </div>
                <button class="btn-buy" data-id="spiral_cone_schwarz_rot" onclick="addProductFromCard(this)">In den Warenkorb</button>
            </div>
        </div>
    </div>
    
    <div id="cart-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Dein Warenkorb</h3>
            <span class="close-btn" onclick="toggleCart()">&times;</span>
        </div>
        <div id="cart-items-container">
            <p class="empty-msg">Dein Warenkorb ist noch leer.</p>
        </div>
        <div class="sidebar-footer">
            <div class="cart-summary-box">
                <div class="summary-row subtotal-row">
                    <span>Zwischensumme:</span>
                    <span id="cart-subtotal">CHF 0.00</span>
                </div>
                <div class="summary-row shipping-row">
                    <span>Versand:</span>
                    <span id="cart-shipping">CHF 5.70</span>
                </div>
                <hr class="summary-divider">
                <div class="summary-row total-row">
                    <strong>Gesamtsumme:</strong>
                    <strong id="cart-total">CHF 0.00</strong>
                </div>
            </div>
            <div style="margin-top: 15px; font-size: 14px; line-height: 1.5; color: #333333;">
                <input type="checkbox" id="legal-checkbox" style="vertical-align: middle; margin-right: 6px; cursor: pointer;">
                <label for="legal-checkbox" style="vertical-align: middle; cursor: pointer;">
                    Ich habe die <a href="../agb" target="_blank" style="color: #d40202; text-decoration: none; font-weight: bold;">AGB</a> und die <a href="../privacy_policy" target="_blank" style="color: #d40202; text-decoration: none; font-weight: bold;">Datenschutzerklärung</a> gelesen und bin mit ihnen einverstanden.<br>
                </label>
            </div>
            <button class="checkout-button" id="checkout-button" disabled onclick="checkout()">Zur Kasse</button>
        </div>
    </div>
    <footer>
    <p>&copy; <span id="copyright"><script>document.getElementById('copyright').appendChild(document.createTextNode(new Date().getFullYear()))</script></span> Fabio3D. Alle Rechte vorbehalten.</p>
    </footer>
</body>
</html>
