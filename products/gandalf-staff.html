<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Gandalf The White Staff - Details</title>
    <link rel="stylesheet" href="product-style.css"> 
    <script src="../cart.js" defer></script>
    <script src="../script.js" defer></script>
    <script src="../slider.js" defer></script>
    <script src="../color-slider.js" defer></script>
</head>
<body>

    <a class="docs" href="../index.html" style="display: inline-block; margin: 20px;">&larr; Zurück zum Shop</a>

    <div class="product-card-detail-view">
        <h1>Gandalf The White Staff</h1>
        <div class="slider-container" hide>
            <div class="slides">
                <a href="products/gandalf-staff.html" class="product-img-link">
                    <img>
                    <img>
                    <img>
                </a>
            </div>
            <button class="arrow prev" id="slides-arrow" onclick="changeSlide(-1)">&#10094;</button>
            <button class="arrow next" id="slides-arrow" onclick="changeSlide(1)">&#10095;</button>
        </div>
        <div class="product-info">
            <span class="prod-category">Deko / Spielzeug</span>
            <div class="long-description">
                <p></p>
            </div>
            <div class="tech-specs">
                <span class="spec"><b>Material:</b> PLA</span>
                <span class="spec"><b>Qualität:</b> 0.20mm</span>
                <span class="spec"><b>Infill:</b> 20% Gyroid</span>
            </div>
            <h4><strong>Varianten</strong></h4>
            <div class="color-slider-container">
                <button type="button" class="nav-arrow left" onclick="scrollSlider(this, -1)">&#10094;</button>
                <button type="button" class="nav-arrow right" onclick="scrollSlider(this, 1)">&#10095;</button>
                <div class="color-slider-track">
                    <button class="variant-btn active" data-price="39.95" data-id="gandalf_staff_mit_beleuchtung" onclick="jumpToSlide(this, 0); updatePrice(this)">Mit Beleuchtung (3 LEDs)</button>
                    <button class="variant-btn" data-price="24.95" data-id="gandalf_staff_ohne_beleuchtung" onclick="jumpToSlide(this, 1); updatePrice(this)">Ohne Beleuchtung</button>
                </div>
            </div>
            <div class="product-footer">
                <span class="currency">CHF </span><span class="price">39,95</span>
                <button class="btn-buy" data-id="gandalf_staff_mit_beleuchtung" onclick="addProductFromCard(this)">In den Warenkorb</button>
            </div>
        </div>
    </div>
    <footer>
    <div class="footer-links">
        <a onclick="switchPage('home')">Home</a> | 
        <a onclick="switchPage('shop')">Shop</a> | 
        <a onclick="switchPage('about')">Über mich</a> | 
        <a onclick="switchPage('contact')">Kontakt</a> | 
        <a onclick="switchPage('impressum')">Impressum</a>
    </div>
    <p>&copy; 2026 Fabio3D. Alle Rechte vorbehalten.</p>
    </footer>
</body>
</html>
