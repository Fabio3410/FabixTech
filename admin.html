<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Fabio3D</title>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <script src="https://kit.fontawesome.com/fba23d88db.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg"/>
    <link rel="shortcut icon" href="/favicon/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png"/>
    <link rel="manifest" href="/favicon/site.webmanifest"/>
    <script src="/alert.js"></script>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #d40202;
            --border: #e2e8f0;
            --border-color: #e2e8f0;
            --light-color: #d40202;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
            --badge-offen-bg: #fef2f2;
            --badge-offen-color: #dc2626;
            --badge-versendet-bg: #f0fdf4;
            --badge-versendet-color: #16a34a;
        }

        html[data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --badge-offen-bg: #450a0a;
            --badge-offen-color: #fca5a5;
            --badge-versendet-bg: #064e3b;
            --badge-versendet-color: #6ee7b7;
        }

        .cookie-banner {
            position: fixed;
            bottom: 25px;
            right: 25px;
            max-width: 400px;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1.2px solid var(--border-color);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            z-index: 9999;
            transition: opacity 0.3s ease, 
                        transform 0.3s ease, 
                        background-color 0.4s ease, 
                        border-color 0.4s ease, 
                        color 0.4s ease;
        }

        .cookie-banner.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        .cookie-content h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .cookie-content p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin: 0 0 1.2rem 0;
            line-height: 1.5;
        }

        .cookie-buttons {
            display: flex;
            justify-content: flex-end;
        }

        .btn-cookie {
            background-color: var(--light-color);
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 7px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn-cookie:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        * { 
            box-sizing: border-box; 
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; 
            padding-top: 85px; 
            transition: background-color 0.3s, color 0.3s; 
        }

        ::-webkit-scrollbar {
            width: 8px; 
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }

        ::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar-thumb);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-thumb-hover);
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            height: 85px;
            background-color: var(--bg-card);
            border-bottom: 1.2px solid var(--border-color);
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 2.4rem;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 800;
            font-size: 1.8rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 1.2px;
            cursor: pointer;
            display: inline-block;
            min-width: 120px;
        }

        .logo span {
            color: var(--dark-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.4rem;
            opacity: 0;
            pointer-events: none;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 21px;
            transition: color 0.3s;
            opacity: 0;
            pointer-events: none;
        }

        .cart-icon {
            background: var(--bg-card);
            padding: 0.6rem 1.2rem;
            border-radius: 24px;
            border: 1.2px solid var(--border-color);
            transition: all 0.2s;
            font-weight: 600;
            min-width: 40px;
            opacity: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 0 20px; 
        }

        button { 
            background: var(--primary); 
            color: white; border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 14px; 
            cursor: pointer; 
            transition: opacity 0.2s; 
        }

        button:hover {
            opacity: 0.9;
        }

        .order-card { 
            background: var(--bg-card); 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            padding: 24px; 
            margin-bottom: 20px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.02); 
        }

        .order-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 16px; 
            margin-bottom: 16px; 
        }

        .order-title {
            font-size: 18px;
            font-weight: 700;
        }

        .badge { 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }

        .badge-offen { 
            background: var(--badge-offen-bg);
            color: var(--badge-offen-color);
        }

        .badge-versendet { 
            background: var(--badge-versendet-bg); 
            color: var(--badge-versendet-color); 
        }

        .order-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 20px; 
        }

        @media (max-width: 600px) { 
            .order-grid {
                grid-template-columns: 1fr;
            }
        }

        .info-block h4 { 
            margin: 0 0 6px 0; 
            font-size: 12px; 
            text-transform: uppercase; 
            color: var(--text-muted); 
        }

        .info-block p { 
            margin: 0; 
            font-size: 14px; 
            line-height: 1.5; 
            font-weight: 500;
        }

        .items-list { 
            background: var(--bg-body); 
            border-radius: 8px; 
            padding: 16px; 
            list-style: none; 
            margin: 0 0 20px 0; 
        }

        .items-list li { 
            display: flex; 
            justify-content: space-between; 
            padding: 6px 0; 
            font-size: 14px;
            border-bottom: 1px dashed var(--border); 
        }

        .items-list li:last-child { 
            border-bottom: none; 
        }

        .order-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .total-price { 
            font-size: 18px; 
            font-weight: 700; 
        }

        .btn-shipped {
            background: #16a34a;
        }

        @media (max-width: 480px) {
            .cookie-banner {
                bottom: 15px;
                left: 15px;
                right: 15px;
                max-width: none;
            }
        }

        @supports not (scrollbar-gutter: stable) {
            html {
                overflow-y: scroll;
            }
        }

        @media (max-width: 1024px) {
            html {
                font-size: 85%;
            }

            .nav-container {
                padding: 0 1.2rem;
            }

            .nav-links { 
                display: none;
            }
        }

        @media (max-width: 400px) {
            .logo {
                min-width: auto;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index" class="logo">FABIO<span class="gradient-text">3D</span></a>
            <ul class="nav-links">
                <li><a class="nav-link active" href="index">Home</a></li>
                <li><a class="nav-link" href="shop">Shop</a></li>
                <li><a class="nav-link" href="about">Über mich</a></li>
                <li><a class="nav-link" href="contact">Kontakt</a></li>
                <li><a class="nav-link" href="impressum">Impressum</a></li>
            </ul>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i> <span id="cart-count">0</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="orders-list"><p style="text-align:center; color: var(--text-muted);">Lade Bestellungen...</p></div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', loadOrders);

function getSessionToken() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    return user.session_id || localStorage.getItem('session_id') || '';
}

async function loadOrders() {
    const container = document.getElementById('orders-list');
    try {
        const token = getSessionToken();
        const headers = { 'Content-Type': 'application/json' };
        
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }

        const res = await fetch('/api/orders', {
            method: 'GET',
            credentials: 'include',
            headers: headers
        });

        if (res.status === 401 || res.status === 403) {
            window.location.href = '/';
            return;
        }

        if (!res.ok) {
            throw new Error(`Server-Status ${res.status}`);
        }

        const orders = await res.json();
        container.innerHTML = '';

        if (!orders || orders.length === 0) {
            container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Noch keine Bestellungen vorhanden.</p>';
            return;
        }

        orders.forEach(order => {
            const itemsHtml = (order.items || []).map(i => `
                <li>
                    <span><strong>${i.quantity}x</strong> ${i.product_name} (${i.variant})</span>
                    <span>CHF ${Number(i.price).toFixed(2)}</span>
                </li>
            `).join('');
            
            const isShipped = order.status === 'versendet';

            container.innerHTML += `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-title">Bestellung #${order.id}</span>
                        <span class="badge" style="background-color: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1;">${order.status || 'Offen'}</span>
                    </div>

                    <div class="order-grid">
                        <div class="info-block">
                            <h4>Kunde</h4>
                            <p>${order.customer_name}<br><small style="color: var(--text-muted);">${order.customer_email}</small></p>
                        </div>
                        <div class="info-block">
                            <h4>Lieferadresse</h4>
                            <p>${order.shipping_address}</p>
                        </div>
                    </div>

                    <ul class="items-list">
                        ${itemsHtml}
                    </ul>

                    <div class="order-footer">
                        <div>
                            <span class="total-price">Gesamt: CHF ${Number(order.total_amount).toFixed(2)}</span>
                            ${order.discount_amount > 0 ? `<br><small style="color: #16a34a;">(inkl. Rabatt: CHF ${Number(order.discount_amount).toFixed(2)})</small>` : ''}
                        </div>
            
                        <div>
                            <select onchange="updateOrderStatus('${order.id}', this.value)" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-weight: 600; cursor: pointer;">
                                <option value="Offen" ${order.status === 'Offen' ? 'selected' : ''}>Offen</option>
                                <option value="In Bearbeitung" ${order.status === 'In Bearbeitung' ? 'selected' : ''}>In Bearbeitung</option>
                                <option value="Versendet" ${order.status === 'Versendet' ? 'selected' : ''}>Versendet</option>
                                <option value="Zugestellt" ${order.status === 'Zugestellt' ? 'selected' : ''}>Zugestellt</option>
                                <option value="Abgebrochen" ${order.status === 'Abgebrochen' ? 'selected' : ''}>Abgebrochen</option>
                            </select>
                        </div>
                    </div>
                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border);">
                        <label style="font-size: 12px; font-weight: bold; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 6px;">Post Sendungsnummer (Tracking-Nr.):</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="tracking-${order.id}" value="${order.tracking_number || ''}" placeholder="z. B. 99.00.123456.12345678" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main);">
                            <button onclick="saveTracking('${order.id}')" style="background: #334155; padding: 8px 14px;">Speichern</button>
                        </div>
                    </div>
                </div>
            `;
        });
    } catch (err) {
        console.error("Fehler beim Laden der Bestellungen:", err);
        container.innerHTML = 
            '<p style="text-align:center; color: var(--text-muted);">Verbindungsfehler zum Server.</p>';
    }
}

async function updateOrderStatus(orderId, newStatus) {
    const token = getSessionToken();
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const res = await fetch('/api/orders', {
        method: 'POST',
        credentials: 'include',
        headers: headers,
        body: JSON.stringify({ orderId, status: newStatus })
    });

    if (res.ok) {
        loadOrders(); 
    } else {
        alert('Status konnte nicht aktualisiert werden.');
    }
}

async function saveTracking(orderId) {
    const trackingNumber = document.getElementById(`tracking-${orderId}`).value.trim();
    const token = getSessionToken();
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;

    const res = await fetch('/api/orders', {
        method: 'POST',
        credentials: 'include',
        headers: headers,
        body: JSON.stringify({ orderId, trackingNumber })
    });

    if (res.ok) {
        alert('Sendungsnummer gespeichert!');
    } else {
        alert('Fehler beim Speichern.');
    }
}
</script>
<script src="/script.js" defer></script>
</body>
</html>
