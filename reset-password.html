<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="Fabio3D">
    <title>Passwort zurücksetzen | Fabio3D</title>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg"/>
    <link rel="shortcut icon" href="favicon/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png"/>
    <link rel="manifest" href="favicon/site.webmanifest"/>
    <script src="alert.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://kit.fontawesome.com/fba23d88db.js" crossorigin="anonymous"></script>
    <script src="/theme-toggle.js" defer></script>
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --primary: #d40202;
            --primary-hover: #b90000;
        }

        html[data-theme="dark"] {
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-page);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            color: var(--text-main);
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .auth-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
            width: 100%;
            max-width: 400px;
            transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease; 
        }

        h2 { 
            margin: 0 0 0.5rem; 
            font-size: 1.5rem; 
            text-align: center; 
            font-weight: 700; 
            color: var(--text-main);
        }

        p.subtitle { 
            color: var(--text-muted); 
            text-align: center; 
            margin-bottom: 2rem; 
            font-size: 0.9rem; 
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 0.6rem;
            box-sizing: border-box;
            font-size: 1rem;
            transition: background-color 0.4s ease, border-color 0.2s, color 0.4s ease;
        }

        input:focus { 
            outline: none; 
            border-color: var(--primary); 
        }

        .btn-action { 
            width: 100%; 
            padding: 0.75rem; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 0.6rem; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 1.5rem; 
            transition: background 0.2s, transform 0.2s; 
        }

        .btn-action:hover { 
            background: var(--primary-hover); 
            transform: scale(1.03); 
        }

        .toggle-text {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .toggle-text a {
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 600; 
            cursor: pointer; 
        }

        .toggle-text a:hover {
            color: var(--primary-hover);
        }
        
        #newPasswordSection {
            display: none;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
        }

        html[data-theme="dark"] footer {
            color: #64748b;
        }

        .theme-toggle-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            cursor: pointer;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55), 
                        background-color 0.4s ease, 
                        border-color 0.4s ease, 
                        box-shadow 0.2s ease;
        }

        .theme-toggle-btn:hover {
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        .theme-toggle-btn i {
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        @media (max-width: 1024px) {
            .theme-toggle-btn {
                bottom: 20px;
                left: 20px;
                width: 48px;
                height: 48px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 id="formTitle">Passwort vergessen</h2>
        <p class="subtitle" id="formSubtitle">Gib deine E-Mail ein, um einen Code zu erhalten.</p>

        <form id="resetForm">
            <div id="emailSection">
                <div class="input-group">
                    <label>E-Mail</label>
                    <input type="email" id="resetEmail" placeholder="name@beispiel.ch" required>
                </div>
                <div class="cf-turnstile" data-sitekey="0x4AAAAAAFW3mjyMEeBEdKP_" style="margin: 15px 0; min-height: 99px;"></div>
                <button type="button" class="btn-action" onclick="sendVerification()">Code senden</button>
            </div>

            <div id="newPasswordSection">
                <div class="input-group">
                    <label>Code</label>
                    <input type="text" id="resetCode" placeholder="123456">
                </div>
                <div class="input-group">
                    <label>Neues Passwort</label>
                    <input type="password" id="newPass" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-action">Passwort speichern</button>
            </div>
        </form>
        
        <p class="toggle-text">
            <a href="login">Zurück zum Login</a>
        </p>
        <footer>
            <p>&copy; <span id="copyright"><script>document.getElementById('copyright').appendChild(document.createTextNode(new Date().getFullYear()))</script></span> Fabio3D. Alle Rechte vorbehalten.</p>
        </footer>
    </div>
    <script>
    async function sendVerification() {
        const email = document.getElementById('resetEmail').value;
        const turnstileToken = document.querySelector('[name="cf-turnstile-response"]')?.value;

        if (!turnstileToken) {
            showAlert('Bitte bestätige, dass du kein Bot bist.', 'Fehler');
            return;
        }
        
        if (email) {
            const response = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'send_reset_code', email: email, turnstileToken: turnstileToken })
            });
            
            const result = await response.json();
            
            if (result.status === 'success') {
                document.getElementById('emailSection').style.display = 'none';
                document.getElementById('newPasswordSection').style.display = 'block';
                document.getElementById('formSubtitle').innerText = 'Wir haben einen Code an deine E-Mail gesendet.';
            } else {
                showAlert(result.message || 'Es existiert kein Konto mit dieser E-Mail-Adresse.', 'Fehler');
            }
        }
    }

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('resetEmail').value;
        const code = document.getElementById('resetCode').value;
        const newPassword = document.getElementById('newPass').value;
        const response = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                action: 'verify_code', 
                email: email, 
                code: code, 
                newPassword: newPassword 
            })
        });

        const result = await response.json();

        if (result.status === 'success') {
            showAlert('Dein Passwort wurde erfolgreich geändert.', 'Erfolg');
            setTimeout(() => {
                window.location.href = 'login';
            }, 2000);
        } else {
            showAlert(result.message || 'Der eingegebene Code ist ungültig.', 'Fehler');
        }
    });
    </script>
</body>
</html>
