<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Passwort zurücksetzen | Fabio3D</title>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        function toggleDarkMode() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }
    </script>
    <style>
        :root { 
            --primary: #d40202; 
            --primary-hover: #960505; 
            --bg: #f8fafc; 
            --text: #0f172a; 
            --card-bg: #ffffff; 
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 2px 2px, #e2e8f0 1px, transparent 0);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            color: var(--text);
        }

        .auth-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease; 
        }

        h2 { 
            margin: 0 0 0.5rem; 
            font-size: 1.5rem; 
            text-align: center; 
            font-weight: 700; 
        }
        p.subtitle { 
            color: #64748b; 
            text-align: center; 
            margin-bottom: 2rem; 
            font-size: 0.9rem; 
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.6rem;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus { 
            outline: none; 
            border-color: var(--primary); 
        }

        .btn-action { 
            width: 100%; 
            padding: 0.75rem; 
            background: var(--primary); 
            color: white; border: none; 
            border-radius: 0.6rem; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 1.5rem; 
            transition: background 0.2s; 
        }

        .btn-action:hover { 
            background: var(--primary-hover); 
            transform: scale(1.03); 
        }

        .toggle-text {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .toggle-text a {
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 600; 
            cursor: pointer; 
        }

        .toggle-text a:hover {
            color: var(--primary-hover);
        }
        
        #newPasswordSection {
            display: none;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h2 id="formTitle">Passwort vergessen</h2>
    <p class="subtitle" id="formSubtitle">Gib deine E-Mail ein, um einen Code zu erhalten.</p>

    <form id="resetForm">
        <div id="emailSection">
            <div class="input-group">
                <label>E-Mail</label>
                <input type="email" id="resetEmail" placeholder="name@beispiel.ch" required>
            </div>
            <button type="button" class="btn-action" onclick="sendVerification()">Code senden</button>
        </div>

        <div id="newPasswordSection">
            <div class="input-group">
                <label>Code</label>
                <input type="text" id="resetCode" placeholder="123456">
            </div>
            <div class="input-group">
                <label>Neues Passwort</label>
                <input type="password" id="newPass" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-action">Passwort speichern</button>
        </div>
    </form>
    
    <p class="toggle-text">
        <a href="login">Zurück zum Login</a>
    </p>
</div>

<script>
async function sendVerification() {
    const email = document.getElementById('resetEmail').value;
    
    if (email) {
        const response = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'send_reset_code', email: email })
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
            document.getElementById('emailSection').style.display = 'none';
            document.getElementById('newPasswordSection').style.display = 'block';
            document.getElementById('formSubtitle').innerText = 'Wir haben einen Code an deine E-Mail gesendet.';
        } else {
            showAlert(result.message || 'Es existiert kein Konto mit dieser E-Mail-Adresse.', 'Fehler');
        }
    }
}

document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('resetEmail').value;
    const code = document.getElementById('resetCode').value;
    const newPassword = document.getElementById('newPass').value;

    const response = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            action: 'verify_code', 
            email: email, 
            code: code, 
            newPassword: newPassword 
        })
    });

    const result = await response.json();

    if (result.status === 'success') {
        showAlert('Dein Passwort wurde erfolgreich geändert.', 'Erfolg');
        setTimeout(() => {
            window.location.href = 'login';
        }, 2000);
    } else {
        showAlert(result.message || 'Der eingegebene Code ist ungültig.', 'Fehler');
    }
});
</script>
<script src="alert.js"></script>
</body>
</html>
