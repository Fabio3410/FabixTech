<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="FabixTech">
    <title>Login | FabixTech</title>
    <link rel="canonical" href="https://fabixtech.ch/" />
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        if (window.location.hostname === 'fabio3d.pages.dev') {
            window.location.replace('https://fabixtech.ch' + window.location.pathname + window.location.search);
        }
    </script>
    <script src="alert.js"></script>
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg"/>
    <link rel="shortcut icon" href="favicon/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png"/>
    <link rel="manifest" href="favicon/site.webmanifest"/>
    <script src="script.js" defer></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://kit.fontawesome.com/fba23d88db.js" crossorigin="anonymous"></script>
    <script src="/theme-toggle.js" defer></script>
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --primary: #d40202;
            --primary-hover: #b90000;
        }

        html[data-theme="dark"] {
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-page);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            color: var(--text-main);
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .auth-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 400px;
            transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        h2 { 
            margin: 0 0 0.5rem; 
            font-size: 1.5rem; 
            text-align: center; 
            font-weight: 700; 
            color: var(--text-main);
        }

        p.subtitle { 
            color: var(--text-muted); 
            text-align: center; 
            margin-bottom: 2rem; 
            font-size: 0.9rem; 
        }

        .input-group { margin-bottom: 1rem; }
        
        label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 600; 
            margin-bottom: 0.4rem; 
            color: var(--text-main); 
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 0.6rem;
            box-sizing: border-box;
            font-size: 1rem;
            transition: background-color 0.4s ease, border-color 0.2s, color 0.4s ease;
        }

        input:focus { outline: none; border-color: var(--primary); }

        .forgot-password {
            display: block;
            text-align: right;
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
            margin-top: 0.3rem;
        }

        .forgot-password:hover {
            color: var(--primary-hover);
        }

        .btn-action {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.6rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background 0.2s, transform 0.2s;
        }

        .btn-action:hover {
            background: var(--primary-hover);
            transform: scale(1.03);
        }

        .toggle-text {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .toggle-text a {
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 600; 
            cursor: pointer; 
        }

        .toggle-text a:hover {
            color: var(--primary-hover);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
        }

        html[data-theme="dark"] footer {
            color: #64748b;
        }

        .theme-toggle-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            cursor: pointer;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55), 
                        background-color 0.4s ease, 
                        border-color 0.4s ease, 
                        box-shadow 0.2s ease;
        }

        .theme-toggle-btn:hover {
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        .theme-toggle-btn i {
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        #footer-version-tag {
            display: none !important;
        }

        @media (max-width: 1024px) {
            .theme-toggle-btn {
                bottom: 20px;
                left: 20px;
                width: 48px;
                height: 48px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 id="formTitle">Willkommen zurück</h2>
        <p class="subtitle" id="formSubtitle">Logge dich in dein Konto ein.</p>

        <form id="authForm">
            <div class="input-group">
                <label>E-Mail</label>
                <input type="email" id="loginEmail" placeholder="name@beispiel.ch" required>
            </div>
            
            <div class="input-group">
                <label>Passwort</label>
                <input type="password" id="loginPass" placeholder="••••••••" required>
                <a href="reset-password" class="forgot-password" id="forgotLink">Passwort vergessen?</a>
            </div>

            <div style="display: block; min-height: 99px;">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFW3mjyMEeBEdKP_" id="login-turnstile" style="margin: 15px 0;"></div>
            </div>

            <button type="submit" class="btn-action" id="submitBtn">Anmelden</button>
        </form>
        
        <p class="toggle-text" id="toggleText">
            Noch kein Konto? <a href="register">Registrieren</a>
        </p>
        <footer>
            <p>&copy; <span id="copyright"><script>document.getElementById('copyright').appendChild(document.createTextNode(new Date().getFullYear()))</script></span> FabixTech. Alle Rechte vorbehalten.</p>
        </footer>
    </div>
    <script>
    document.getElementById('login-turnstile').setAttribute('data-theme', localStorage.getItem('theme') || 'light');

    document.getElementById('authForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        const turnstileToken = document.querySelector('[name="cf-turnstile-response"]')?.value;

        if (!turnstileToken) {
            showAlert('Bitte bestätige, dass du kein Bot bist.', 'Fehler');
            return;
        }

        const response = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'login', email: email, password: password, turnstileToken: turnstileToken })
        });

        const result = await response.json();
        
        if (result.status === 'success') {
            localStorage.setItem('user', JSON.stringify(result.user));
            
            const sessionId = result.session_id || (result.user && result.user.session_id);
            if (sessionId) {
                localStorage.setItem('session_id', sessionId);
            }
            
            if (result.user && result.user.is_admin) {
                localStorage.setItem('is_admin', 'true');
            } else {
                localStorage.removeItem('is_admin');
            }

            showAlert('Erfolgreich angemeldet!', 'Willkommen');
            setTimeout(() => {
                window.location.href = result.user && result.user.is_admin ? '/admin' : '/'; 
            }, 1500);
        } else {
            showAlert(result.message || 'Falsche Anmeldedaten.', 'Fehler');
            if (typeof turnstile !== 'undefined') turnstile.reset();
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        const theme = localStorage.getItem('theme') || 'light';
        const widget = document.getElementById('turnstile-widget');
        if (widget) {
            widget.setAttribute('data-theme', theme);
        }
    });
    </script>
</body>
</html>
