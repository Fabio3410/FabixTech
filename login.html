<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Login | Fabio3D</title>
    <script src="alert.js"></script>
    <style>
        :root {
            --primary: #d40202;
            --primary-hover: #960505;
            --bg: #f8fafc;
            --text: #0f172a;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 2px 2px, #e2e8f0 1px, transparent 0);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text);
        }

        .auth-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }

        h2 { margin: 0 0 0.5rem; font-size: 1.5rem; text-align: center; font-weight: 700; }
        p.subtitle { color: #64748b; text-align: center; margin-bottom: 2rem; font-size: 0.9rem; }

        .input-group { margin-bottom: 1rem; }
        
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #475569; }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.6rem;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus { outline: none; border-color: var(--primary); }

        .forgot-password {
            display: block;
            text-align: right;
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
            margin-top: 0.3rem;
        }

        .forgot-password:hover {
            color: var(--primary-hover);
        }

        .btn-action {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.6rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: var(--primary-hover);
            transform: scale(1.03);
        }

        .toggle-text {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .toggle-text a {
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 600; 
            cursor: pointer; 
        }

        .toggle-text a:hover {
            color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h2 id="formTitle">Willkommen zurück</h2>
    <p class="subtitle" id="formSubtitle">Logge dich in dein Konto ein.</p>

    <form id="authForm">
        <div class="input-group">
            <label>E-Mail</label>
            <input type="email" id="loginEmail" placeholder="name@beispiel.ch" required>
        </div>
        
        <div class="input-group">
            <label>Passwort</label>
            <input type="password" id="loginPass" placeholder="••••••••" required>
            <a href="reset-password" class="forgot-password" id="forgotLink">Passwort vergessen?</a>
        </div>

        <button type="submit" class="btn-action" id="submitBtn">Anmelden</button>
    </form>
    
    <p class="toggle-text" id="toggleText">
        Noch kein Konto? <a href="register">Registrieren</a>
    </p>
</div>

<script>
document.getElementById('authForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPass').value;

    const response = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', email: email, password: password })
    });

    const result = await response.json();

    if (result.status === 'success') {
        showAlert('Erfolgreich angemeldet!', 'Willkommen');
        setTimeout(() => {
            window.location.href = '/';
        }, 1500);
    } else {
        showAlert(result.message || 'Falsche Anmeldedaten.', 'Fehler');
    }
});
</script>
</body>
</html>
