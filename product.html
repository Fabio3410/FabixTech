<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="Fabio3D">
    <title>Produktdetails | Fabio3D</title>
    <link rel="stylesheet" href="product-style.css">
    <script src="/products.js" defer></script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <link rel="icon" type="image/png" href="../favicon/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg"/>
    <link rel="shortcut icon" href="../favicon/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png"/>
    <link rel="manifest" href="../favicon/site.webmanifest"/>
    <script src="/alert.js" defer></script>
    <script src="/cart.js" defer></script>
    <script src="/script.js" defer></script>
    <script src="/slider.js" defer></script>
    <script src="/color-slider.js" defer></script>
    <script src="/theme-toggle.js" defer></script>
    <script src="https://kit.fontawesome.com/fba23d88db.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="shop" class="btn-back">&larr; Zurück zum Shop</a>
        </div>
    </nav>
    <main>
        <div class="product-details">
            <div id="product-detail-container" class="product-card-detail-view">
            </div>
        </div>
    </main>
    
    <div id="cart-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Dein Warenkorb</h3>
            <span class="close-btn" onclick="toggleCart()">&times;</span>
        </div>
        <div id="cart-items-container">
            <p class="empty-msg">Dein Warenkorb ist noch leer.</p>
        </div>
        <div class="sidebar-footer">
            <div class="cart-summary-box">
                <div class="summary-row subtotal-row">
                    <span>Zwischensumme:</span>
                    <span id="cart-subtotal">CHF 0.00</span>
                </div>
                <div class="summary-row shipping-row">
                    <span>Versand:</span>
                    <span id="cart-shipping">CHF 5.70</span>
                </div>
                <hr class="summary-divider">
                <div class="summary-row total-row">
                    <strong>Gesamtsumme:</strong>
                    <strong id="cart-total">CHF 0.00</strong>
                </div>
            </div>
            <div style="margin-top: 15px; font-size: 14px; line-height: 1.5; color: #333333;">
                <input type="checkbox" id="legal-checkbox" style="vertical-align: middle; margin-right: 6px; cursor: pointer;">
                <label class="legal-text" for="legal-checkbox" style="vertical-align: middle; cursor: pointer;">
                    Ich habe die <a href="../agb" target="_blank" style="color: #d40202; text-decoration: none; font-weight: bold;">AGB</a> und die <a href="../privacy_policy" target="_blank" style="color: #d40202; text-decoration: none; font-weight: bold;">Datenschutzerklärung</a> gelesen und bin mit ihnen einverstanden.<br>
                </label>
            </div>
            <button class="checkout-button" id="checkout-button" disabled onclick="checkout()">Zur Kasse</button>
        </div>
    </div>
    
    <footer>
        <div class="footer-links">
            <a href="../index">Home</a> | 
            <a href="../shop">Shop</a> | 
            <a href="../about">Über mich</a> | 
            <a href="../contact">Kontakt</a> | 
            <a href="../impressum">Impressum</a>
        </div>
        <p>&copy; <span id="copyright"><script>document.getElementById('copyright').appendChild(document.createTextNode(new Date().getFullYear()))</script></span> Fabio3D. Alle Rechte vorbehalten.</p>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        try {
            const res = await fetch('/api/products');
            const productsDB = await res.json();
            const product = productsDB.find(p => p.baseId === productId);
            
            if (!product) {
                document.getElementById('product-detail-container').innerHTML = "<h1>Produkt nicht gefunden</h1>";
                return;
            }

            const defaultVariant = product.variants[0];
            const allImages = [...new Set(product.variants.flatMap(v => v.images))].join(', ');
            
            const variantsHtml = product.variants.map((v, index) => `
                <button class="variant-btn ${index === 0 ? 'active' : ''}" 
                        data-variant-images="${v.images.join(', ')}" 
                        data-id="${v.id}" 
                        onclick="jumpToSlide(this, ${index}); updatePrice(this)">${v.name}</button>
            `).join('');

            document.getElementById('product-detail-container').innerHTML = `
                <h1>${product.title}</h1>
                <div class="detail-left-side">
                    <div class="slider-container">
                        <div class="slides">
                            <img class="product-img" 
                                src="${defaultVariant.images[0]}" 
                                data-images="${allImages}"
                                data-index="0"
                                alt="${product.title}">
                        </div>
                        <button class="arrow prev" id="slides-arrow">&#10094;</button>
                        <button class="arrow next" id="slides-arrow">&#10095;</button>
                    </div>
                    <div class="tech-specs">
                        <span class="spec"><b>Material:</b> ${product.material}</span>
                        <span class="spec"><b>Qualität:</b> ${product.quality}</span>
                        <span class="spec"><b>Infill:</b> ${product.infill}</span>
                    </div>
                </div>
                <div class="product-info">
                    <span class="prod-category">${product.category}</span>
                    <div class="long-description">
                        <p>${product.longDescription}</p>
                    </div>
                    <h4><strong>Varianten</strong></h4>
                    <div class="color-slider-container">
                        <button type="button" class="nav-arrow left" onclick="scrollSlider(this, -1)">&#10094;</button>
                        <button type="button" class="nav-arrow right" onclick="scrollSlider(this, 1)">&#10095;</button>
                        <div class="color-slider-track">
                            ${variantsHtml}
                        </div>
                    </div>
                
                    <div id="stock-alert-box" style="display: none; background: var(--bg-dark); border: 1px dashed var(--border-color); padding: 16px; border-radius: 8px; margin: 12px 0 20px 0;">
                        <p style="font-size: 14px; font-weight: 600; color: var(--text-main); margin: 0 0 8px 0;">Benachrichtigen, sobald wieder verfügbar:</p>
                        <div style="display: flex; gap: 8px;">
                            <input type="email" id="stock-alert-email" placeholder="deine.email@beispiel.ch" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-size: 14px; outline: none;">
                            <button type="button" onclick="subscribeStockAlert()" style="background: var(--light-color); color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px;">Anmelden</button>
                        </div>
                        <div id="stock-alert-msg" style="font-size: 12px; margin-top: 6px; font-weight: 500;"></div>
                    </div>
                </div>
                <div class="product-footer">
                    <div class="price-block">
                        <span class="currency">CHF</span>
                        <span class="price">${defaultVariant.price.toFixed(2).replace('.', ',')}</span>
                    </div>
                    <button class="btn-buy" data-id="${defaultVariant.id}" onclick="addProductFromCard(this)">In den Warenkorb</button>
                </div>
            `;
            
            if (typeof initSliders === 'function') initSliders();
            if (typeof checkSliderArrows === 'function') checkSliderArrows();
            if (typeof fetchAllStocks === 'function') fetchAllStocks();
        } catch (err) {
            console.error("Fehler beim Laden des Produkts:", err);
        }
    });

    async function subscribeStockAlert() {
        const emailInput = document.getElementById('stock-alert-email');
        const msgDiv = document.getElementById('stock-alert-msg');
        const activeBtn = document.querySelector('.variant-btn.active');

        if (!activeBtn) return;
        const variantId = activeBtn.getAttribute('data-id');
        const email = emailInput ? emailInput.value.trim() : '';

        if (!email || !email.includes('@') || !email.includes('.')) {
            if (msgDiv) {
                msgDiv.style.color = '#d40202';
                msgDiv.innerText = 'Bitte gib eine gültige E-Mail-Adresse ein.';
            }
            return;
        }

        try {
            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'subscribe_stock', variantId, email })
            });

            const data = await res.json();
            if (res.ok) {
                if (msgDiv) {
                    msgDiv.style.color = '#16a34a';
                    msgDiv.innerText = 'Erfolgreich eingetragen! Du erhältst eine Mail, sobald der Artikel wieder da ist.';
                }
                if (emailInput) emailInput.value = '';
            } else {
                if (msgDiv) {
                    msgDiv.style.color = '#d40202';
                    msgDiv.innerText = data.error || 'Fehler beim Anmelden.';
                }
            }
        } catch (e) {
            if (msgDiv) {
                msgDiv.style.color = '#d40202';
                msgDiv.innerText = 'Verbindungsfehler zum Server.';
            }
        }
    }
    </script>
</body>
</html>
